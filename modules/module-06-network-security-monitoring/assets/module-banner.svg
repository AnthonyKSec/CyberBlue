<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="927" viewBox="0 0 1650 927">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02060c"/>
    <stop offset=".48" stop-color="#06111d"/>
    <stop offset="1" stop-color="#02070c"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#21c8ff"/>
    <stop offset="1" stop-color="#087cff"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8fe85b"/>
    <stop offset="1" stop-color="#2fc46f"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#0e334c" stroke-width="1" opacity=".24"/>
  </pattern>
  <style>
    .over{font:600 25px Arial,sans-serif;letter-spacing:7px;fill:#40cfff}
    .module{font:900 88px Arial Black,Arial,sans-serif;letter-spacing:4px;fill:#f2f6fa}
    .num{fill:#67c94f}
    .title{font:900 58px Arial Black,Arial,sans-serif;letter-spacing:1.5px;fill:#f5f8fb}
    .sub{font:700 27px Arial,sans-serif;letter-spacing:4px;fill:#48caff}
    .tag{font:700 23px Arial,sans-serif;fill:#d8e6ef}
    .brand{font:900 44px Arial Black,Arial,sans-serif;letter-spacing:3px;fill:#eef3f6}
    .micro{font:600 17px Arial,sans-serif;letter-spacing:4px;fill:#8be95e}
  </style>
</defs>
<rect width="1650" height="927" fill="url(#bg)"/>
<rect width="1650" height="927" fill="url(#grid)"/>
<circle cx="1440" cy="105" r="55" fill="#dbe8ef" opacity=".8"/>
<path d="M0 700L175 570 300 655 450 505 570 625 710 470 850 615 1010 480 1160 620 1320 500 1480 620 1650 490V927H0Z" fill="#06121b"/>
<path d="M0 730L175 600 300 685 450 535 570 655 710 500 850 645 1010 510 1160 650 1320 530 1480 650 1650 520" fill="none" stroke="#0b4660" stroke-width="3" opacity=".65"/>

