# Place as /etc/systemd/system/velociraptor_server.service.d/10-cyberblue-security.conf
[Unit]
Description=Velociraptor server — CyberBlue DFIR
Wants=network-online.target
After=network-online.target
RequiresMountsFor=/srv/velociraptor
ConditionPathIsMountPoint=/srv/velociraptor
ConditionPathExists=/etc/velociraptor/.cyberblue-start-authorized

[Service]
ExecStartPre=/usr/bin/mountpoint -q /srv/velociraptor
